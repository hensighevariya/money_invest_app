name: money_invest_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

workspace:
  - packages/common_extensions
  - packages/cache_service
  - packages/country_picker

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  adaptive_layout:
    git:
      url: https://github.com/pintusingh28/flutter-packages
      path: adaptive_layout

  ui_components:
    git:
      url: https://github.com/pintusingh28/flutter-packages
      path: ui_components

  common_extensions:
    path: packages/common_extensions

  cache_service:
    path: packages/cache_service

  country_picker:
    path: packages/country_picker

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  retry: ^3.1.2

  get_it: ^8.0.3
  injectable: ^2.5.0
  json_annotation: ^4.9.0

  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  firebase_remote_config: ^5.4.3

  equatable: ^2.0.7
  provider: ^6.1.4
  flutter_bloc: ^9.1.0
  hydrated_bloc: ^10.0.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.1
  formz: ^0.8.0

  go_router: ^15.1.1

  gap: ^3.0.1
  animations: ^2.0.11
  flutter_svg: ^2.3.0
  extended_image: ^10.0.1
  dotted_border: ^2.1.0

  cross_file: ^0.3.4+2
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  share_plus: ^11.0.0
  connectivity_plus: ^6.1.4
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  device_info_plus: ^11.4.0
  url_launcher: ^6.3.1
  flutter_local_notifications: ^19.1.0

  image_picker: ^1.1.2
  file_picker: ^10.1.2

  shimmer: ^3.0.0
  pinput: ^5.0.1
  lottie: ^3.3.1
  readmore: ^3.0.0

  dio: ^5.8.0+1
  socket_io_client: ^3.1.1
  mime: ^2.0.0
  http_parser: ^4.1.2
  encrypt: ^5.0.3
  crypto: ^3.0.6
  uuid: ^4.5.1
  version: ^3.0.2
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^5.0.0
  injectable_generator: ^2.7.0
  json_serializable: ^6.9.5
  build_runner: ^2.4.15
  intl_utils: ^2.8.14
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/svg_icon/
    - assets/lottie/

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  arb_dir: lib/src/localization/arb/
  output_dir: lib/src/localization/generated/
  use_deferred_loading: true
